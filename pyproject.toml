[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavision"
version = "0.1.0"
description = "Open-source video perception and behavioral analysis framework"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy"
]

[tool.setuptools.packages.find]
where = ["src"]